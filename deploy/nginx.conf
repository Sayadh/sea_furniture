# /etc/nginx/sites-available/sea_furniture
# Replace example.am with your domain. Obtain TLS certificates with:
#   sudo certbot --nginx -d example.am -d www.example.am

upstream sea_web { server 127.0.0.1:3000; keepalive 32; }
upstream sea_api { server 127.0.0.1:4000; keepalive 16; }

# Rate limit for public form endpoints (in addition to the API's own throttling)
limit_req_zone $binary_remote_addr zone=sea_forms:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name example.am www.example.am;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://example.am$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.example.am;
    ssl_certificate     /etc/letsencrypt/live/example.am/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.am/privkey.pem;
    return 301 https://example.am$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.am;

    ssl_certificate     /etc/letsencrypt/live/example.am/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.am/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Up to 5 images × 5 MB in a repair request
    client_max_body_size 30m;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # images.unsplash.com is used only by the sample (seed) images
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://images.unsplash.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-src https://www.google.com https://maps.google.com; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # API (NestJS)
    location /api/ {
        proxy_pass http://sea_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~ ^/api/(orders|requests/) {
        limit_req zone=sea_forms burst=10 nodelay;
        proxy_pass http://sea_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded images (served by the API from UPLOAD_DIR)
    location /uploads/ {
        proxy_pass http://sea_api;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Nuxt build assets — long cache
    location /_nuxt/ {
        proxy_pass http://sea_web;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Nuxt SSR
    location / {
        proxy_pass http://sea_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
